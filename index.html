<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis SAS Informatika - Kelas 11 (NORAK EDITION)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @keyframes rainbowBg {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff, 0 0 30px #ffff00; }
    50% { box-shadow: 0 0 25px #00ff00, 0 0 40px #ff0000, 0 0 60px #ff00ff; }
  }
  @keyframes hueRotate {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff0000, #00ff00, #ff8800, #ff00ff);
    background-size: 1400% 1400%;
    animation: rainbowBg 8s ease infinite;
    min-height: 100vh;
    padding: 20px;
    color: #000;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fffbe6;
    border: 6px dashed #ff00ff;
    border-radius: 25px;
    box-shadow: 0 0 40px #ff00ff, 0 0 80px #00ffff;
    overflow: hidden;
    animation: shake 0.6s infinite;
  }

  header {
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
    background-size: 400% 400%;
    animation: rainbowBg 3s linear infinite;
    color: #fff;
    padding: 30px 25px;
    text-align: center;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
  }
  header h1 {
    font-size: 1.8em;
    margin-bottom: 8px;
    letter-spacing: 2px;
    animation: blink 1.2s infinite;
  }
  header p { font-size: 1em; font-weight: bold; }

  .section { padding: 25px 30px; }

  /* ===== FORM IDENTITAS ===== */
  .identity-form label {
    display: block;
    font-weight: 900;
    margin-bottom: 6px;
    color: #ff00ff;
    font-size: 1.1em;
    text-shadow: 1px 1px 0 #00ffff;
  }
  .identity-form input {
    width: 100%;
    padding: 12px 14px;
    border: 4px solid #00ff00;
    border-radius: 12px;
    font-size: 1em;
    margin-bottom: 18px;
    background: #ffffcc;
    font-family: inherit;
    font-weight: bold;
    transition: border 0.2s, box-shadow 0.2s;
  }
  .identity-form input:focus {
    outline: none;
    border-color: #ff00ff;
    box-shadow: 0 0 15px #ff00ff;
  }

  .btn {
    display: inline-block;
    background: linear-gradient(90deg, #ff0000, #ff00ff, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
    background-size: 400% 400%;
    animation: rainbowBg 2s linear infinite, glowPulse 2s infinite;
    color: #fff;
    border: 4px solid #000;
    padding: 16px 32px;
    font-size: 1.15em;
    font-weight: 900;
    border-radius: 50px;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 1px;
    transition: transform 0.15s;
  }
  .btn:hover {
    transform: scale(1.05) rotate(-1deg);
  }
  .btn-secondary {
    background: linear-gradient(90deg, #333, #666, #333);
    animation: blink 1s infinite;
    border-color: #ff00ff;
  }

  /* ===== SOAL ===== */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 30px;
    background: repeating-linear-gradient(45deg, #ffff00, #ffff00 10px, #ff8800 10px, #ff8800 20px);
    border-bottom: 4px solid #ff00ff;
  }
  .quiz-header .student-info {
    font-weight: 900;
    color: #000;
    background: #00ffff;
    padding: 4px 10px;
    border-radius: 8px;
    border: 2px solid #000;
    text-shadow: 1px 1px 0 #fff;
  }
  .progress-text {
    font-weight: 900;
    font-size: 0.9em;
    color: #000;
    background: #ff00ff;
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    border: 2px solid #000;
  }

  .progress-bar {
    height: 14px;
    background: #000;
    width: 100%;
    border-bottom: 3px solid #ff00ff;
  }
  .progress-fill {
    height: 100%;
    background: repeating-linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    background-size: 200% 100%;
    animation: rainbowBg 1.5s linear infinite;
    width: 0%;
    transition: width 0.3s;
  }

  .question-card {
    padding: 25px 30px;
    border-bottom: 4px dotted #ff00ff;
    background: #fff;
  }
  .question-card:nth-child(odd) { background: #fffbe6; }
  .question-card:nth-child(even) { background: #e6f7ff; }
  .question-card:last-of-type { border-bottom: none; }

  .q-number {
    display: inline-block;
    background: #ff00ff;
    color: #ffff00;
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.9em;
    margin-bottom: 12px;
    border: 3px solid #000;
    text-shadow: 1px 1px 0 #000;
    animation: blink 1.5s infinite;
  }
  .q-text {
    font-weight: 900;
    font-size: 1.08em;
    margin-bottom: 15px;
    line-height: 1.5;
    color: #000080;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 15px;
    border: 3px solid #0000ff;
    border-radius: 12px;
    cursor: pointer;
    background: #ffffcc;
    font-weight: bold;
    transition: all 0.15s;
  }
  .option:hover {
    border-color: #ff00ff;
    background: #ffccff;
    transform: translateX(5px) scale(1.02);
  }
  .option input { margin-top: 3px; accent-color: #ff00ff; cursor: pointer; transform: scale(1.3); }
  .option.selected {
    border-color: #ff0000;
    background: #00ff00;
    animation: glowPulse 1.5s infinite;
  }

  /* ===== HASIL ===== */
  .result-box {
    text-align: center;
    padding: 35px 25px;
  }
  .score-circle {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    border: 8px solid #000;
    animation: glowPulse 1.5s infinite, hueRotate 4s linear infinite;
  }
  .score-circle .score-num {
    font-size: 2.8em;
    font-weight: 900;
    line-height: 1;
    text-shadow: 3px 3px 0 #000;
  }
  .score-circle .score-label {
    font-size: 0.85em;
    font-weight: 900;
    margin-top: 4px;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
  }

  .result-summary {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 0 10px;
  }
  .stat {
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 900;
    border: 4px solid #000;
    font-size: 1.05em;
  }
  .stat.correct {
    background: #00ff00;
    color: #000;
    box-shadow: 0 0 20px #00ff00;
  }
  .stat.wrong {
    background: #ff0000;
    color: #fff;
    box-shadow: 0 0 20px #ff0000;
    text-shadow: 2px 2px 0 #000;
  }
  .stat.empty {
    background: #ffff00;
    color: #000;
    box-shadow: 0 0 20px #ffff00;
  }

  .result-message {
    font-size: 1.2em;
    font-weight: 900;
    margin: 15px 0 25px;
    padding: 18px;
    border-radius: 15px;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size: 400% 400%;
    animation: rainbowBg 3s linear infinite;
    color: #000;
    border: 4px dashed #000;
    text-shadow: 1px 1px 0 #fff;
  }

  .review-title {
    text-align: left;
    font-weight: 900;
    font-size: 1.2em;
    margin: 25px 0 12px;
    color: #ff00ff;
    text-shadow: 2px 2px 0 #00ffff;
    animation: blink 2s infinite;
  }
  .review-item {
    text-align: left;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 0.92em;
    line-height: 1.5;
    border: 3px solid #000;
    font-weight: bold;
  }
  .review-item.correct { background: #ccffcc; border-left: 8px solid #00ff00; }
  .review-item.wrong { background: #ffcccc; border-left: 8px solid #ff0000; }
  .review-item.empty { background: #ffffcc; border-left: 8px solid #ffff00; }
  .review-item .r-q { font-weight: 900; margin-bottom: 4px; color: #000080; }
  .review-item .r-detail { color: #333; }
  .review-item .r-detail span.ans-user { color: #ff0000; font-weight: 900; }
  .review-item .r-detail span.ans-key { color: #009900; font-weight: 900; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .section { padding: 20px 18px; }
    .question-card { padding: 20px 18px; }
    .quiz-header { padding: 12px 18px; }
    header h1 { font-size: 1.2em; }
    .result-summary { gap: 10px; }
    .stat { padding: 10px 16px; font-size: 0.9em; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌈✨ KUIS SAS INFORMATIKA ✨🌈</h1>
    <p>★彡 KELAS 11 — NORAK EDITION 彡★</p>
  </header>

  <!-- ===== FORM IDENTITAS ===== -->
  <div id="identitySection" class="section">
    <form class="identity-form" id="identityForm">
      <label for="nama">💖 Nama Lengkap 💖</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>

      <label for="absen">🔥 Nomor Absen 🔥</label>
      <input type="number" id="absen" placeholder="Masukkan nomor absen" min="1" max="50" required>

      <button type="submit" class="btn">🚀 MULAI KUIS 🚀</button>
    </form>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quizSection" class="hidden">
    <div class="quiz-header">
      <div class="student-info" id="studentInfo"></div>
      <div class="progress-text" id="progressText"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionsContainer"></div>
    <div class="section">
      <button id="submitBtn" class="btn">✅ SELESAI & LIHAT HASIL ✅</button>
    </div>
  </div>

  <!-- ===== HASIL ===== -->
  <div id="resultSection" class="hidden">
    <div class="result-box">
      <div class="score-circle">
        <div class="score-num" id="finalScore">0</div>
        <div class="score-label">SKOR</div>
      </div>

      <div class="result-summary">
        <div class="stat correct">✔ Benar: <span id="countCorrect">0</span></div>
        <div class="stat wrong">✘ Salah: <span id="countWrong">0</span></div>
        <div class="stat empty">⚠ Kosong: <span id="countEmpty">0</span></div>
      </div>

      <div class="result-message" id="resultMessage"></div>

      <div class="review-title">🔍 REVIEW JAWABAN 🔍</div>
      <div id="reviewContainer"></div>

      <div style="margin-top:25px;">
        <button class="btn btn-secondary" onclick="location.reload()">🔁 ULANGI KUIS 🔁</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= DATA SOAL ================= */
const questions = [
  { q: "Aplikasi Microsoft Word digunakan untuk ....",
    opts: ["Mengolah data angka", "Membuat dan mengedit dokumen teks",
           "Membuat animasi", "Mengolah database", "Mengedit video"], ans: 1 },
  { q: "Fungsi utama fitur Bold pada Microsoft Word adalah ....",
    opts: ["Memiringkan tulisan", "Menggarisbawahi tulisan", "Menebalkan tulisan",
           "Menghapus tulisan", "Mengubah warna halaman"], ans: 2 },
  { q: "Kombinasi tombol keyboard untuk menyimpan dokumen adalah ....",
    opts: ["Ctrl + A", "Ctrl + C", "Ctrl + V", "Ctrl + S", "Ctrl + X"], ans: 3 },
  { q: "Fitur Justify pada Microsoft Word berfungsi untuk ....",
    opts: ["Meratakan teks ke kiri", "Meratakan teks ke kanan",
           "Meratakan teks di tengah", "Meratakan teks pada kedua sisi",
           "Mengubah ukuran huruf"], ans: 3 },
  { q: "Untuk membuat tabel pada Microsoft Word, pengguna dapat memilih menu ....",
    opts: ["Home", "Insert", "Review", "View", "Design"], ans: 1 },
  { q: "Ekstensi file standar dokumen Microsoft Word adalah ....",
    opts: [".xlsx", ".pptx", ".docx", ".jpg", ".mp3"], ans: 2 },
  { q: "Fitur Header dan Footer digunakan untuk ....",
    opts: ["Menghapus halaman",
           "Menambahkan informasi pada bagian atas dan bawah halaman",
           "Mengubah warna teks", "Membuat tabel", "Mengatur ukuran gambar"], ans: 1 },
  { q: "Fitur Mail Merge pada Microsoft Word berguna untuk ....",
    opts: ["Membuat animasi", "Membuat surat massal dengan sumber data",
           "Menghapus dokumen", "Mengubah dokumen menjadi video", "Mengedit foto"], ans: 1 },
  { q: "Microsoft Excel merupakan aplikasi yang digunakan untuk ....",
    opts: ["Mengolah angka dan data", "Membuat animasi", "Mengedit video",
           "Membuat desain 3D", "Mengakses internet"], ans: 0 },
  { q: "Pertemuan antara baris dan kolom pada Microsoft Excel disebut ....",
    opts: ["Workbook", "Worksheet", "Cell", "Formula", "Range"], ans: 2 },
  { q: "Rumus Excel untuk menjumlahkan data dari sel A1 sampai A5 adalah ....",
    opts: ["=AVERAGE(A1:A5)", "=MAX(A1:A5)", "=SUM(A1:A5)",
           "=MIN(A1:A5)", "=COUNT(A1:A5)"], ans: 2 },
  { q: "Fungsi rumus =AVERAGE(B1:B10) adalah ....",
    opts: ["Mencari nilai terbesar", "Mencari nilai terkecil",
           "Menghitung nilai rata-rata", "Menjumlahkan data",
           "Menghitung jumlah huruf"], ans: 2 },
  { q: "Rumus untuk mencari nilai tertinggi dalam Microsoft Excel adalah ....",
    opts: ["SUM", "MIN", "MAX", "COUNT", "AVERAGE"], ans: 2 },
  { q: "Fungsi rumus =IF(C2>=75,\"Lulus\",\"Tidak Lulus\") digunakan untuk ....",
    opts: ["Menjumlahkan nilai", "Menentukan hasil berdasarkan kondisi",
           "Menghitung rata-rata", "Mengurutkan data", "Menghapus data"], ans: 1 },
  { q: "Simbol yang digunakan untuk mengawali penulisan rumus di Excel adalah ....",
    opts: ["+", "-", "=", "#", "@"], ans: 2 },
  { q: "Aplikasi Microsoft PowerPoint digunakan untuk ....",
    opts: ["Membuat laporan keuangan", "Membuat presentasi",
           "Mengolah database", "Membuat surat", "Mengolah angka"], ans: 1 },
  { q: "Efek perpindahan dari satu slide ke slide lainnya disebut ....",
    opts: ["Animation", "Transition", "Design", "Layout", "Format"], ans: 1 },
  { q: "Fitur Animation pada PowerPoint berfungsi untuk ....",
    opts: ["Memberikan efek gerak pada objek dalam slide", "Menghapus slide",
           "Mengatur ukuran kertas", "Menghitung angka",
           "Membuat tabel otomatis"], ans: 0 },
  { q: "Ekstensi file standar Microsoft PowerPoint adalah ....",
    opts: [".docx", ".xlsx", ".pptx", ".pdf", ".txt"], ans: 2 },
  { q: "Salah satu ciri presentasi yang baik adalah ....",
    opts: ["Menggunakan teks sebanyak mungkin",
           "Menggunakan banyak warna yang tidak sesuai",
           "Menggunakan tulisan berukuran sangat kecil",
           "Menampilkan informasi secara singkat, jelas, dan menarik",
           "Menggunakan animasi pada setiap objek"], ans: 3 },
  { q: "Fitur Page Layout pada Microsoft Word digunakan untuk ....",
    opts: ["Mengatur tata letak halaman dokumen", "Menghapus seluruh tulisan",
           "Membuat animasi", "Menghitung angka", "Memutar video"], ans: 0 },
  { q: "Fungsi dari fitur Sort pada Microsoft Excel adalah ....",
    opts: ["Menghapus data", "Mengurutkan data berdasarkan kriteria tertentu",
           "Mengubah warna halaman", "Menambahkan gambar",
           "Menggabungkan dokumen"], ans: 1 },
  { q: "Rumus Excel yang digunakan untuk menghitung jumlah sel yang berisi angka adalah ....",
    opts: ["SUM", "MAX", "MIN", "COUNT", "AVERAGE"], ans: 3 },
  { q: "Perintah keyboard Ctrl + P pada aplikasi Microsoft Office berfungsi untuk ....",
    opts: ["Menyimpan dokumen", "Membuka dokumen", "Mencetak dokumen",
           "Menyalin teks", "Menempelkan teks"], ans: 2 },
  { q: "Fitur Slide Master pada Microsoft PowerPoint berfungsi untuk ....",
    opts: ["Menghapus semua slide",
           "Mengatur desain dan format seluruh slide secara konsisten",
           "Menghitung jumlah slide", "Menambahkan rumus matematika",
           "Mengubah presentasi menjadi dokumen Excel"], ans: 1 }
];

const letters = ["A", "B", "C", "D", "E"];
const userAnswers = new Array(questions.length).fill(null);
let student = { nama: "", absen: "" };

/* ================= RENDER SOAL ================= */
function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";

    const num = document.createElement("div");
    num.className = "q-number";
    num.textContent = `✦ Soal ${idx + 1} ✦`;

    const qText = document.createElement("div");
    qText.className = "q-text";
    qText.textContent = item.q;

    const opts = document.createElement("div");
    opts.className = "options";

    item.opts.forEach((opt, oIdx) => {
      const label = document.createElement("label");
      label.className = "option";
      label.innerHTML = `
        <input type="radio" name="q${idx}" value="${oIdx}">
        <span><strong>${letters[oIdx]}.</strong> ${opt}</span>
      `;

      const radio = label.querySelector("input");
      radio.addEventListener("change", () => {
        userAnswers[idx] = oIdx;
        opts.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
        label.classList.add("selected");
        updateProgress();
      });

      opts.appendChild(label);
    });

    card.appendChild(num);
    card.appendChild(qText);
    card.appendChild(opts);
    container.appendChild(card);
  });

  updateProgress();
}

/* ================= PROGRESS ================= */
function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    `💫 ${answered}/${questions.length} (${pct}%) 💫`;
}

/* ================= SUBMIT ================= */
function submitQuiz() {
  const unanswered = userAnswers.filter(a => a === null).length;
  if (unanswered > 0) {
    const confirmSubmit = confirm(
      `⚠️ Masih ada ${unanswered} soal yang belum dijawab. Yakin ingin menyelesaikan kuis?`
    );
    if (!confirmSubmit) return;
  }

  let correct = 0, wrong = 0, empty = 0;
  const reviewContainer = document.getElementById("reviewContainer");
  reviewContainer.innerHTML = "";

  questions.forEach((item, idx) => {
    const userAns = userAnswers[idx];
    const isCorrect = userAns === item.ans;
    const isEmpty = userAns === null;

    if (isCorrect) correct++;
    else if (isEmpty) empty++;
    else wrong++;

    const div = document.createElement("div");
    div.className = "review-item " + (isCorrect ? "correct" : isEmpty ? "empty" : "wrong");

    const userAnswerText = isEmpty
      ? "<em>Tidak dijawab</em>"
      : `${letters[userAns]}. ${item.opts[userAns]}`;
    const keyAnswerText = `${letters[item.ans]}. ${item.opts[item.ans]}`;

    div.innerHTML = `
      <div class="r-q">Soal ${idx + 1}: ${item.q}</div>
      <div class="r-detail">
        Jawaban Anda: <span class="ans-user">${userAnswerText}</span><br>
        Kunci Jawaban: <span class="ans-key">${keyAnswerText}</span>
        ${isCorrect ? " ✅" : isEmpty ? " ⚠️" : " ❌"}
      </div>
    `;
    reviewContainer.appendChild(div);
  });

  const score = Math.round((correct / questions.length) * 100);
  document.getElementById("finalScore").textContent = score;
  document.getElementById("countCorrect").textContent = correct;
  document.getElementById("countWrong").textContent = wrong;
  document.getElementById("countEmpty").textContent = empty;

  const msg = document.getElementById("resultMessage");
  let message = "";
  if (score >= 90) message = `🎉🌟 WOW KEREN BANGET, ${student.nama}! NILAIMU ${score}! 🌟🎉`;
  else if (score >= 75) message = `👍✨ BAGUS, ${student.nama}! NILAIMU ${score}! ✨👍`;
  else if (score >= 60) message = `💪🔥 LUMAYAN, ${student.nama}. NILAIMU ${score}. BELAJAR LAGI YAA! 🔥💪`;
  else message = `📚😅 SEMANGAT, ${student.nama}! NILAIMU ${score}. JANGAN MENYERAH! 😅📚`;
  msg.textContent = message;

  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= INIT ================= */
document.getElementById("identityForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const nama = document.getElementById("nama").value.trim();
  const absen = document.getElementById("absen").value.trim();

  if (!nama || !absen) {
    alert("Mohon isi nama dan nomor absen terlebih dahulu.");
    return;
  }

  student.nama = nama;
  student.absen = absen;

  document.getElementById("studentInfo").textContent =
    `👤 ${nama} — No. Absen: ${absen}`;

  document.getElementById("identitySection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");

  renderQuestions();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("submitBtn").addEventListener("click", submitQuiz);
</script>
